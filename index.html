<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NeuroNova - Dementia Memory Care & Cognitive Training</title>
  
  <!-- PWA Manifest & Android Installability -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121826">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NeuroNova">

  <!-- Google Fonts: Outfit for bold headings, Inter for clear readable body text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Nature & Cognitive Wellness Ambient Background Canvas (Light Theme) -->
  <div class="bg-nature-canvas" aria-hidden="true">
    <!-- Warm Sunlight & Soft Ambient Glows -->
    <div class="sunlight-glow"></div>
    <div class="bg-glow-blob blob-1"></div>
    <div class="bg-glow-blob blob-2"></div>
    <div class="bg-glow-blob blob-3"></div>

    <!-- Soft Floating Nature Leaves -->
    <div class="floating-leaf float-leaf-1">
      <svg viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 40 C10 40, 20 10, 40 10 C40 10, 30 40, 10 40 Z" fill="#10b981" fill-opacity="0.4" />
        <path d="M10 40 Q25 25 40 10" stroke="#059669" stroke-opacity="0.45" stroke-width="1.5" />
      </svg>
    </div>
    <div class="floating-leaf float-leaf-2">
      <svg viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M40 40 C40 40, 30 10, 10 10 C10 10, 20 40, 40 40 Z" fill="#34d399" fill-opacity="0.38" />
        <path d="M40 40 Q25 25 10 10" stroke="#059669" stroke-opacity="0.4" stroke-width="1.5" />
      </svg>
    </div>
    <div class="floating-leaf float-leaf-3">
      <svg viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 40 C10 40, 25 5, 45 15 C45 15, 25 45, 10 40 Z" fill="#818cf8" fill-opacity="0.3" />
        <path d="M10 40 Q28 25 45 15" stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.5" />
      </svg>
    </div>
    <div class="floating-leaf float-leaf-4">
      <svg viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 25 C5 25, 25 5, 40 20 C40 20, 20 40, 5 25 Z" fill="#059669" fill-opacity="0.3" />
        <path d="M5 25 Q22 22 40 20" stroke="#047857" stroke-opacity="0.35" stroke-width="1.2" />
      </svg>
    </div>

    <!-- Organic Decorative Foliage Elements (Framing Screen Corners) -->
    <div class="leaf-element leaf-top-left">
      <svg viewBox="0 0 260 260" fill="none" xmlns="http://www.w3.org/2000/svg" class="leaf-svg">
        <defs>
          <linearGradient id="leafGradTL1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981" stop-opacity="0.5" />
            <stop offset="60%" stop-color="#34d399" stop-opacity="0.35" />
            <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.15" />
          </linearGradient>
          <linearGradient id="leafGradTL2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#059669" stop-opacity="0.45" />
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
          </linearGradient>
          <filter id="glowTL" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>
        <path d="M-10 -10 C 40 50, 110 100, 200 150" stroke="#059669" stroke-opacity="0.3" stroke-width="3" fill="none" />
        <path d="M -5 -5 C 20 40, 80 40, 95 -10 C 60 20, 20 10, -5 -5 Z" fill="url(#leafGradTL1)" filter="url(#glowTL)" />
        <path d="M 30 20 Q 60 10 95 -10" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" />
        <path d="M 35 30 C 70 70, 145 60, 150 15 C 105 45, 65 35, 35 30 Z" fill="url(#leafGradTL2)" />
        <path d="M 65 42 Q 110 40 150 15" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" />
        <path d="M 75 70 C 120 120, 195 105, 210 50 C 160 90, 110 75, 75 70 Z" fill="url(#leafGradTL1)" />
        <circle cx="120" cy="110" r="3" fill="#10b981" fill-opacity="0.6" class="sparkle-dot" />
        <circle cx="170" cy="70" r="2" fill="#059669" fill-opacity="0.7" class="sparkle-dot" />
        <circle cx="210" cy="130" r="4" fill="#8b5cf6" fill-opacity="0.4" class="sparkle-dot" />
      </svg>
    </div>

    <div class="leaf-element leaf-top-right">
      <svg viewBox="0 0 260 260" fill="none" xmlns="http://www.w3.org/2000/svg" class="leaf-svg">
        <defs>
          <linearGradient id="leafGradTR1" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#34d399" stop-opacity="0.5" />
            <stop offset="70%" stop-color="#0284c7" stop-opacity="0.3" />
            <stop offset="100%" stop-color="#10b981" stop-opacity="0.15" />
          </linearGradient>
          <linearGradient id="leafGradTR2" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
          </linearGradient>
        </defs>
        <path d="M 270 -10 C 210 50, 140 110, 50 170" stroke="#10b981" stroke-opacity="0.3" stroke-width="3" fill="none" />
        <path d="M 265 -5 C 235 45, 175 40, 160 -15 C 195 20, 240 10, 265 -5 Z" fill="url(#leafGradTR1)" />
        <path d="M 225 30 C 185 75, 110 65, 105 20 C 150 50, 190 38, 225 30 Z" fill="url(#leafGradTR2)" />
        <path d="M 175 75 C 130 125, 55 115, 45 60 C 95 95, 140 82, 175 75 Z" fill="url(#leafGradTR1)" />
        <circle cx="130" cy="120" r="3" fill="#0284c7" fill-opacity="0.5" class="sparkle-dot" />
        <circle cx="80" cy="80" r="2.5" fill="#10b981" fill-opacity="0.6" class="sparkle-dot" />
      </svg>
    </div>

    <div class="leaf-element leaf-bottom-left">
      <svg viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg" class="leaf-svg">
        <defs>
          <linearGradient id="leafGradBL1" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#10b981" stop-opacity="0.5" />
            <stop offset="50%" stop-color="#34d399" stop-opacity="0.35" />
            <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1" />
          </linearGradient>
          <linearGradient id="leafGradBL2" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.25" />
          </linearGradient>
        </defs>
        <path d="M -10 290 C 50 220, 120 150, 210 70" stroke="#059669" stroke-opacity="0.3" stroke-width="3.5" fill="none" />
        <path d="M -5 285 C 30 230, 80 210, 115 155 C 80 185, 30 225, -5 285 Z" fill="url(#leafGradBL1)" />
        <path d="M 35 240 C 85 190, 145 170, 175 110 C 130 145, 75 185, 35 240 Z" fill="url(#leafGradBL2)" />
        <path d="M 85 190 C 140 135, 205 115, 235 55 C 185 95, 130 135, 85 190 Z" fill="url(#leafGradBL1)" />
        <circle cx="160" cy="120" r="3.5" fill="#10b981" fill-opacity="0.6" class="sparkle-dot" />
        <circle cx="210" cy="80" r="2.5" fill="#38bdf8" fill-opacity="0.6" class="sparkle-dot" />
      </svg>
    </div>

    <div class="leaf-element leaf-bottom-right">
      <svg viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg" class="leaf-svg">
        <defs>
          <linearGradient id="leafGradBR1" x1="100%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4" />
            <stop offset="60%" stop-color="#ec4899" stop-opacity="0.2" />
            <stop offset="100%" stop-color="#34d399" stop-opacity="0.2" />
          </linearGradient>
          <linearGradient id="leafGradBR2" x1="100%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#059669" stop-opacity="0.45" />
            <stop offset="100%" stop-color="#10b981" stop-opacity="0.25" />
          </linearGradient>
        </defs>
        <path d="M 290 290 C 230 220, 160 150, 70 70" stroke="#8b5cf6" stroke-opacity="0.25" stroke-width="3" fill="none" />
        <path d="M 285 285 C 240 230, 190 210, 155 155 C 190 185, 240 225, 285 285 Z" fill="url(#leafGradBR1)" />
        <path d="M 240 240 C 190 190, 130 170, 100 110 C 145 145, 200 185, 240 240 Z" fill="url(#leafGradBR2)" />
        <path d="M 190 190 C 135 135, 70 115, 40 55 C 90 95, 155 135, 190 190 Z" fill="url(#leafGradBR1)" />
        <circle cx="110" cy="120" r="3" fill="#ec4899" fill-opacity="0.5" class="sparkle-dot" />
        <circle cx="60" cy="70" r="2.5" fill="#8b5cf6" fill-opacity="0.6" class="sparkle-dot" />
      </svg>
    </div>
  </div>

  <!-- App Main Root Container -->
  <div id="app" class="app-container">
    <!-- Dynamic view loaded here via JS -->
  </div>

  <!-- Level Up & Session Evaluation Celebration Modal -->
  <div id="level-up-modal" class="modal-overlay hidden">
    <div class="modal-card celebration-card">
      <div class="confetti-icon">🎉 🌟 🎉</div>
      <h2 id="modal-title">Congratulations!</h2>
      <p id="modal-desc">You performed amazingly! You have advanced to Level 2!</p>
      <div class="modal-stats" id="modal-stats-container">
        <!-- Stat badges injected dynamically -->
      </div>
      <button id="modal-close-btn" class="btn btn-primary btn-large">Continue Daily Journey 🚀</button>
    </div>
  </div>

  <!-- Application Engine & Data Services -->
  <script src="js/engine/patientDataService.js"></script>
  <script src="js/engine/caregiverAuthService.js"></script>
  <script src="js/engine/baselineService.js"></script>
  <script src="js/engine/levelService.js"></script>
  <script src="js/engine/gameDifficultyService.js"></script>
  <script src="js/engine/voiceService.js"></script>
  <script src="js/engine/voiceAssistant.js"></script>
  <script src="js/engine/adaptiveEngine.js"></script>

  <!-- Games -->
  <script src="js/games/memoryMatch.js"></script>
  <script src="js/games/sequenceRecall.js"></script>
  <script src="js/games/pictureRecall.js"></script>
  <script src="js/games/patternMemory.js"></script>
  <script src="js/games/whatChanged.js"></script>

  <!-- Patient Views -->
  <script src="js/patient/patientDashboard.js"></script>
  <script src="js/patient/gameMenu.js"></script>
  <script src="js/patient/memoriesView.js"></script>
  <script src="js/patient/remindersView.js"></script>
  <script src="js/patient/routineView.js"></script>

  <!-- Caregiver Views -->
  <script src="js/caregiver/chartRenderer.js"></script>
  <script src="js/caregiver/caregiverDashboard.js"></script>
  <script src="js/caregiver/memoryManager.js"></script>
  <script src="js/caregiver/reminderManager.js"></script>
  <script src="js/caregiver/settingsManager.js"></script>

  <!-- App Entry Point -->
  <script src="js/app.js"></script>
</body>
</html>
